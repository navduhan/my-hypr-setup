# -----------------------------------------------------------------------------
# File: windowrules.conf
# Author: Naveen Duhan
# Description: Rules for window behavior (floating, opacity, blocking, etc.).
# -----------------------------------------------------------------------------

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float, class:^(kitty)$,title:^(kitty)$

# Floating windows
windowrule = float 1, match:class ^(pavucontrol)$
windowrule = float 1, match:class ^(nm-connection-editor)$

# Kitty: Pseudo-tiling and Centered (v0.53.0 Syntax)

windowrule = pseudo 1, match:class ^(kitty)$
windowrule = center 1, match:class ^(kitty)$
windowrule = size 1200 800, match:class ^(kitty)$



# XWayland scaling/compatibility tweaks (optional beyond the main config)
# windowrulev2 = forceinput, class:^(xwayland_app)$

